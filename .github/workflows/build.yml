name: Сборка

on:
  push:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Liquid Glass есть только в SDK iOS 26: берём самый новый Xcode 26 на машине.
      - name: Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -n 1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Проект Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Сборка
        run: |
          set -o pipefail
          xcodebuild build \
            -project Tune.xcodeproj \
            -scheme Tune \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION=0.1.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|BUILD|\*\*" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Ошибки сборки
        if: failure()
        run: grep -E "error:" -A 6 build.log | head -n 400 || tail -n 80 build.log

      # Без подписи: её ставит SideStore или AltStore на телефоне своим Apple ID.
      - name: Упаковка .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Tune.app Payload/
          zip -qry Tune.ipa Payload

      # Источник для AltStore и SideStore: по нему приложение обновляется одной кнопкой.
      - name: Источник обновлений
        run: |
          python3 - <<'EOF'
          import json, os, datetime
          number = os.environ["GITHUB_RUN_NUMBER"]
          repo = "https://github.com/tune-music/tune-ios"
          changes = json.load(open("Tune/changes.json", encoding="utf-8"))
          notes = "\n".join("• " + item for item in changes[0]["items"]) if changes else "Сборка " + os.environ["GITHUB_SHA"][:7]
          shots = [repo + "/releases/download/latest/shot-" + name + ".png" for name in ("home", "player", "search", "library", "album")]
          source = {
              "name": "Tune",
              "identifier": "dev.tune.music.source",
              "subtitle": "Яндекс Музыка без цензуры и с офлайн-библиотекой",
              "iconURL": "https://raw.githubusercontent.com/tune-music/tune-ios/main/Tune/Assets.xcassets/AppIcon.appiconset/icon.png",
              "website": repo,
              "tintColor": "#facc15",
              "apps": [{
                  "name": "Tune",
                  "bundleIdentifier": "dev.tune.music",
                  "developerName": "Tune",
                  "subtitle": "Яндекс Музыка без цензуры",
                  "localizedDescription": "Нативный клиент Яндекс Музыки: «Моя волна», коллекция, поиск, тексты, версии треков без цензуры и скачивание для игры без сети.",
                  "iconURL": "https://raw.githubusercontent.com/tune-music/tune-ios/main/Tune/Assets.xcassets/AppIcon.appiconset/icon.png",
                  "tintColor": "#facc15",
                  "category": "entertainment",
                  "screenshots": shots,
                  "versions": [{
                      "version": "0.1." + number,
                      "buildVersion": number,
                      "date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                      "localizedDescription": notes,
                      "downloadURL": repo + "/releases/download/latest/Tune.ipa",
                      "size": os.path.getsize("Tune.ipa"),
                      "minOSVersion": "16.0",
                  }],
                  "appPermissions": {"entitlements": [], "privacy": {}},
              }],
              "news": [],
          }
          json.dump(source, open("altstore.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          EOF
          cat altstore.json

      - uses: actions/upload-artifact@v4
        with:
          name: Tune-ipa
          path: Tune.ipa

      - name: Релиз latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Tune.ipa altstore.json \
            --title "Последняя сборка 0.1.${{ github.run_number }}" \
            --notes "Неподписанный .ipa для установки через SideStore или AltStore. Собран из ${GITHUB_SHA::7}." \
            --latest --target "$GITHUB_SHA"

  # Снимки экранов в симуляторе на демо-данных: по ним проверяется интерфейс.
  screens:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Liquid Glass есть только в SDK iOS 26: берём самый новый Xcode 26 на машине.
      - name: Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -n 1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Проект Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Сборка для симулятора
        run: |
          set -o pipefail
          xcodebuild build \
            -project Tune.xcodeproj \
            -scheme Tune \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath sim \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            | tee sim.log | grep -E "error:|BUILD|\*\*" || true
          grep -q "BUILD SUCCEEDED" sim.log

      - name: Ошибки сборки
        if: failure()
        run: grep -E "error:" -A 6 sim.log | head -n 400 || tail -n 80 sim.log

      - name: Снимки
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; v=lambda r: [int(n) for n in r.split('iOS-')[-1].split('-')]; c=[x for r in sorted((r for r in d if 'iOS-' in r), key=v, reverse=True) for x in d[r] if x['name'].startswith('iPhone')]; print(next((x for x in c if x['name'] in ('iPhone 17', 'iPhone 16')), c[0])['udid'])")
          xcrun simctl list devices available | grep -B 30 "$UDID" | grep -E "^--|$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$UDID" sim/Build/Products/Debug-iphonesimulator/Tune.app
          mkdir screens
          for screen in home homescroll toast find changes shelf search library likes filter album albumscroll artist playlist select downloads stats stations history player actions queue lyrics wave picker settings; do
            xcrun simctl launch "$UDID" dev.tune.music -demo -screen "$screen"
            sleep 10
            xcrun simctl io "$UDID" screenshot "screens/$screen.png"
            xcrun simctl terminate "$UDID" dev.tune.music || true
          done

      # Те же экраны на маленьком и большом телефоне, на прошлой iOS и с крупным шрифтом:
      # по ним видно, где вёрстка не помещается.
      - name: Снимки других размеров
        run: |
          pick() {
            xcrun simctl list devices available -j | python3 -c '
          import json, sys
          kind = sys.argv[1]
          d = json.load(sys.stdin)["devices"]
          ver = lambda r: [int(n) for n in r.split("iOS-")[-1].split("-")]
          runs = sorted((r for r in d if "iOS-" in r), key=ver, reverse=True)
          def find(test, where):
              for r in where:
                  for x in d[r]:
                      if x["name"].startswith("iPhone") and test(x["name"]):
                          return x["udid"]
              return ""
          if kind == "small":
              print(find(lambda n: "SE" in n or "16e" in n or "mini" in n, runs))
          elif kind == "large":
              print(find(lambda n: "Pro Max" in n, runs))
          else:
              print(find(lambda n: True, [r for r in runs if ver(r)[0] < 26]))
          ' "$1"
          }
          shoot() {
            tag=$1; udid=$2; size=$3
            if [ -z "$udid" ]; then echo "нет симулятора для $tag"; return 0; fi
            xcrun simctl list devices available | grep "$udid" || true
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl status_bar "$udid" override --time "9:41" --batteryState charged --batteryLevel 100 || true
            xcrun simctl ui "$udid" content_size "$size" || true
            xcrun simctl install "$udid" sim/Build/Products/Debug-iphonesimulator/Tune.app
            for screen in home search library album artist player queue settings; do
              xcrun simctl launch "$udid" dev.tune.music -demo -screen "$screen"
              sleep 9
              xcrun simctl io "$udid" screenshot "screens/$tag-$screen.png"
              xcrun simctl terminate "$udid" dev.tune.music || true
            done
            xcrun simctl ui "$udid" content_size large || true
            xcrun simctl shutdown "$udid" || true
          }
          MAIN=$(xcrun simctl list devices booted -j | python3 -c "import json,sys; print(next(x['udid'] for r in json.load(sys.stdin)['devices'].values() for x in r))")
          shoot text "$MAIN" extra-extra-extra-large
          shoot small "$(pick small)" large
          shoot big "$(pick large)" large
          shoot old "$(pick old)" large

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: screens

  # Снимки экранов для страницы приложения в AltStore и SideStore.
  shots:
    if: github.ref == 'refs/heads/main'
    needs: [build, screens]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: screens
          path: screens

      - name: Снимки в релиз
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for name in home player search library album; do
            cp "screens/$name.png" "shot-$name.png"
          done
          gh release upload latest shot-*.png --clobber
