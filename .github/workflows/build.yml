name: Сборка

on:
  push:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Проект Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Сборка
        run: |
          set -o pipefail
          xcodebuild build \
            -project Tune.xcodeproj \
            -scheme Tune \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|warning: unre|BUILD|\*\*" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Ошибки сборки
        if: failure()
        run: grep -E "error:" -A 6 build.log | head -n 400 || tail -n 80 build.log

      # Без подписи: её ставит SideStore на телефоне своим Apple ID.
      - name: Упаковка .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Tune.app Payload/
          zip -qry Tune.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Tune-ipa
          path: Tune.ipa

      - name: Релиз latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Tune.ipa \
            --title "Последняя сборка" \
            --notes "Неподписанный .ipa для установки через SideStore или AltStore. Собран из ${GITHUB_SHA::7}." \
            --latest --target "$GITHUB_SHA"
