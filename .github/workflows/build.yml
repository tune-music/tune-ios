name: Сборка

on:
  push:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Проект Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Сборка
        run: |
          set -o pipefail
          xcodebuild build \
            -project Tune.xcodeproj \
            -scheme Tune \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION=0.1.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|BUILD|\*\*" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Ошибки сборки
        if: failure()
        run: grep -E "error:" -A 6 build.log | head -n 400 || tail -n 80 build.log

      # Без подписи: её ставит SideStore или AltStore на телефоне своим Apple ID.
      - name: Упаковка .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Tune.app Payload/
          zip -qry Tune.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Tune-ipa
          path: Tune.ipa

      - name: Релиз latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Tune.ipa \
            --title "Последняя сборка 0.1.${{ github.run_number }}" \
            --notes "Неподписанный .ipa для установки через SideStore или AltStore. Собран из ${GITHUB_SHA::7}." \
            --latest --target "$GITHUB_SHA"

  # Снимки экранов в симуляторе на демо-данных: по ним проверяется интерфейс.
  screens:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Проект Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Сборка для симулятора
        run: |
          set -o pipefail
          xcodebuild build \
            -project Tune.xcodeproj \
            -scheme Tune \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath sim \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            | tee sim.log | grep -E "error:|BUILD|\*\*" || true
          grep -q "BUILD SUCCEEDED" sim.log

      - name: Ошибки сборки
        if: failure()
        run: grep -E "error:" -A 6 sim.log | head -n 400 || tail -n 80 sim.log

      - name: Снимки
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in sorted(d, reverse=True) if 'iOS' in r for x in d[r] if x['name'].startswith('iPhone 16')))")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$UDID" sim/Build/Products/Debug-iphonesimulator/Tune.app
          mkdir screens
          for screen in home search library likes album artist player settings; do
            xcrun simctl launch "$UDID" dev.tune.music -demo -screen "$screen"
            sleep 10
            xcrun simctl io "$UDID" screenshot "screens/$screen.png"
            xcrun simctl terminate "$UDID" dev.tune.music || true
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: screens
