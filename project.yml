name: Tune
configs:
  Debug: debug
  Release: release
  CarPlay: release
  Dev: release
options:
  bundleIdPrefix: dev.tune
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: "NO"
    TUNE_DISPLAY_NAME: Tune
    TUNE_LINK_SCHEME: tune
    TUNE_DEV_SOURCE_URL: ""
  configs:
    Dev:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TUNE_DEV"
      TUNE_DISPLAY_NAME: Tune Dev
      TUNE_LINK_SCHEME: tune-dev
targets:
  Tune:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Tune
        excludes:
          - Info.plist
      - path: Shared
    dependencies:
      - target: TuneWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tune.music
        PRODUCT_NAME: Tune
        INFOPLIST_FILE: Tune/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_OPTIMIZATION_LEVEL: "-O"
      configs:
        Dev:
          PRODUCT_BUNDLE_IDENTIFIER: dev.tune.music.dev
        CarPlay:
          CODE_SIGNING_ALLOWED: "YES"
          CODE_SIGNING_REQUIRED: "YES"
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: Apple Development
          CODE_SIGN_ENTITLEMENTS: Config/TuneCarPlay.entitlements
  TuneWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: TuneWidgets
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tune.music.widgets
        INFOPLIST_FILE: TuneWidgets/Info.plist
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TUNE_WIDGET_EXTENSION"
        SKIP_INSTALL: "YES"
      configs:
        Dev:
          PRODUCT_BUNDLE_IDENTIFIER: dev.tune.music.dev.widgets
        CarPlay:
          CODE_SIGNING_ALLOWED: "YES"
          CODE_SIGNING_REQUIRED: "YES"
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: Apple Development
schemes:
  Tune-CarPlay:
    build:
      targets:
        Tune: all
    run:
      config: CarPlay
    archive:
      config: CarPlay
